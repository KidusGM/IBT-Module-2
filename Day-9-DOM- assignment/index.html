  <body>

    <h1>Addis Resturant </h1>

    <div class="market-container">

      <p class="description">
        This is a list of items available in the Addis Market. You can find a
        variety of Tradtional Food, spices Foods, and other goods.
      </p>

      <div class="main">

        <form action="" id="item-form">

          <input
            type="text"
            placeholder="Enter your product Name"
            id="p-name"
            required
          />

          <input
            type="file"
            placeholder="Enter Product Image"
            id="p-image"
            required
          />

          <input
            type="number"
            placeholder="Enter Product Price"
            id="p-price"
            required
          />

          <input
            type="number"
            id="p-quantity"
            placeholder="Quantity"
            min="1"
            required
          />

          <button type="submit">Add Item</button>

        </form>

      </div>
